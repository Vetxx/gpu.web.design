<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background: soft spotlight behind the GPU on the right -->
    <radialGradient id="bg" cx="820" cy="315" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#D8E7FF"/>
      <stop offset="55%"  stop-color="#EBF2FF"/>
      <stop offset="100%" stop-color="#F5F8FF"/>
    </radialGradient>

    <!-- Fan unit (radius 120), centred at 0,0 -->
    <g id="fan">
      <circle r="120" fill="#E0ECFF" stroke="#3B5EDB" stroke-width="2.4"/>
      <circle r="111" fill="none"   stroke="#7BA4E8" stroke-width="1.4"/>
      <!-- 7 blades at 51.43° intervals -->
      <path d="M12,-23 C25,-55 51,-93 45,-109 C39,-118 17,-116 4,-103 C-10,-90 -4,-51 12,-23 Z"
            fill="#BDD4F5" stroke="#3B5EDB" stroke-width="1.9" stroke-linejoin="round"/>
      <path d="M12,-23 C25,-55 51,-93 45,-109 C39,-118 17,-116 4,-103 C-10,-90 -4,-51 12,-23 Z"
            fill="#BDD4F5" stroke="#3B5EDB" stroke-width="1.9" stroke-linejoin="round" transform="rotate(51.43)"/>
      <path d="M12,-23 C25,-55 51,-93 45,-109 C39,-118 17,-116 4,-103 C-10,-90 -4,-51 12,-23 Z"
            fill="#BDD4F5" stroke="#3B5EDB" stroke-width="1.9" stroke-linejoin="round" transform="rotate(102.86)"/>
      <path d="M12,-23 C25,-55 51,-93 45,-109 C39,-118 17,-116 4,-103 C-10,-90 -4,-51 12,-23 Z"
            fill="#BDD4F5" stroke="#3B5EDB" stroke-width="1.9" stroke-linejoin="round" transform="rotate(154.29)"/>
      <path d="M12,-23 C25,-55 51,-93 45,-109 C39,-118 17,-116 4,-103 C-10,-90 -4,-51 12,-23 Z"
            fill="#BDD4F5" stroke="#3B5EDB" stroke-width="1.9" stroke-linejoin="round" transform="rotate(205.71)"/>
      <path d="M12,-23 C25,-55 51,-93 45,-109 C39,-118 17,-116 4,-103 C-10,-90 -4,-51 12,-23 Z"
            fill="#BDD4F5" stroke="#3B5EDB" stroke-width="1.9" stroke-linejoin="round" transform="rotate(257.14)"/>
      <path d="M12,-23 C25,-55 51,-93 45,-109 C39,-118 17,-116 4,-103 C-10,-90 -4,-51 12,-23 Z"
            fill="#BDD4F5" stroke="#3B5EDB" stroke-width="1.9" stroke-linejoin="round" transform="rotate(308.57)"/>
      <circle r="30" fill="#DCE9FF" stroke="#3B5EDB" stroke-width="2.2"/>
      <circle r="20" fill="#F4F8FF" stroke="#3B5EDB" stroke-width="1.8"/>
      <circle r="9"  fill="#3B5EDB"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- ─────────────────────────────────────────
       LEFT SIDE — text content
       ───────────────────────────────────────── -->

  <!-- Accent rule above headline -->
  <rect x="72" y="218" width="56" height="5" rx="2.5" fill="#2563EB"/>

  <!-- Main headline -->
  <text x="72" y="302"
        font-family="Liberation Sans, Arial, Helvetica, sans-serif"
        font-weight="bold" font-size="96"
        fill="#2563EB" letter-spacing="-2">GPU.LT</text>

  <!-- Tagline -->
  <text x="74" y="352"
        font-family="Liberation Sans, Arial, Helvetica, sans-serif"
        font-weight="bold" font-size="28"
        fill="#1E3A5F">Vaizdo plokščių remontas</text>

  <!-- Services line -->
  <text x="74" y="392"
        font-family="Liberation Sans, Arial, Helvetica, sans-serif"
        font-size="19" fill="#4B6EA8">
    Diagnostika · BGA Reballing · Priežiūra
  </text>

  <!-- CTA button -->
  <rect x="74" y="420" width="230" height="50" rx="10" fill="#2563EB"/>
  <text x="189" y="452" text-anchor="middle"
        font-family="Liberation Sans, Arial, Helvetica, sans-serif"
        font-weight="bold" font-size="20" fill="#FFFFFF">
    Susisiekite šiandien
  </text>

  <!-- Domain hint at bottom -->
  <text x="74" y="530"
        font-family="Liberation Sans, Arial, Helvetica, sans-serif"
        font-size="16" fill="#7BA4C8">gpu.lt</text>

  <!-- ─────────────────────────────────────────
       RIGHT SIDE — GPU card illustration
       ───────────────────────────────────────── -->

  <!-- PCIe retention clip -->
  <rect x="578" y="158" width="44" height="18" rx="4"
        fill="#C8DAEF" stroke="#3B5EDB" stroke-width="2.4"/>
  <!-- PCIe bracket -->
  <rect x="578" y="172" width="26" height="306" rx="5"
        fill="#C8DAEF" stroke="#3B5EDB" stroke-width="2.4"/>
  <!-- I/O cutouts (5) -->
  <rect x="582" y="202" width="17" height="22" rx="2.5" fill="#3B5EDB"/>
  <rect x="582" y="238" width="17" height="22" rx="2.5" fill="#3B5EDB"/>
  <rect x="582" y="274" width="17" height="22" rx="2.5" fill="#3B5EDB"/>
  <rect x="582" y="310" width="17" height="22" rx="2.5" fill="#3B5EDB"/>
  <rect x="582" y="346" width="17" height="22" rx="2.5" fill="#3B5EDB"/>

  <!-- Main shroud -->
  <rect x="600" y="158" width="545" height="318" rx="16"
        fill="#D0E3FA" stroke="#3B5EDB" stroke-width="2.6"/>
  <!-- Top accent strip -->
  <rect x="600" y="158" width="545" height="28" rx="16" fill="#B8CFEE"/>
  <rect x="600" y="178" width="545" height="8"           fill="#B8CFEE"/>
  <line x1="600" y1="186" x2="1145" y2="186" stroke="#3B5EDB" stroke-width="1.6"/>
  <!-- Centre divider -->
  <line x1="868" y1="160" x2="868" y2="474" stroke="#3B5EDB" stroke-width="2"/>

  <!-- Fans -->
  <use href="#fan" transform="translate(733, 325)"/>
  <use href="#fan" transform="translate(1003, 325)"/>

  <!-- 8-pin power connector -->
  <rect x="908" y="476" width="148" height="22" rx="4"
        fill="#B8CFEE" stroke="#3B5EDB" stroke-width="2"/>
  <rect x="915" y="481" width="12" height="12" rx="2" fill="#3B5EDB"/>
  <rect x="931" y="481" width="12" height="12" rx="2" fill="#3B5EDB"/>
  <rect x="947" y="481" width="12" height="12" rx="2" fill="#3B5EDB"/>
  <rect x="963" y="481" width="12" height="12" rx="2" fill="#3B5EDB"/>
  <rect x="979" y="481" width="12" height="12" rx="2" fill="#3B5EDB"/>
  <rect x="995" y="481" width="12" height="12" rx="2" fill="#3B5EDB"/>
  <rect x="1011" y="481" width="12" height="12" rx="2" fill="#3B5EDB"/>
  <rect x="1027" y="481" width="12" height="12" rx="2" fill="#3B5EDB"/>
</svg>
